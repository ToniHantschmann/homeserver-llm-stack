[project]
name = "assistent"
version = "0.1.0"
description = "Tages-/Wochenassistent aus Obsidian-Weekly-Note und Kalender, Text über LiteLLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "icalendar>=6.0",
    "openai>=1.40",
    "recurring-ical-events>=3.3",
    "uvicorn>=0.30",
]

[project.scripts]
assistent = "assistent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
